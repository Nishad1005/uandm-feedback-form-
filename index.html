<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#F4EDE6">
<meta name="robots" content="noindex,nofollow">
<title>Share Your Experience · U&M Designs</title>
<link rel="icon" href="/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
.state{max-width:560px;margin:70px auto;padding:36px 28px;text-align:center;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.state h2{color:var(--ink);font-size:30px;margin-bottom:12px;letter-spacing:-.04em}
.state p{line-height:1.6}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brass);border-radius:50%;margin:90px auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.busy{opacity:.6;pointer-events:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow);z-index:30}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="brand-logo" src="/logo.png" alt="U&M Designs — Upholstery & More"><span class="brand-divider"></span><span class="brand-context">CUSTOMER EXPERIENCE</span></div>
  <span class="header-right">An invitation to share</span>
</header>
<main id="view-survey">
  <div class="survey"><div class="progress" id="progress"></div><div id="step" aria-live="off"><div class="spinner"></div></div>
    <div class="feedback-foot"><b>U&M DESIGNS</b> · UPHOLSTERY & MORE<br>Thoughtfully designed, thoughtfully heard.</div>
  </div>
</main>

<script src="/config.js"></script>
<script src="/questionnaire.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb=window.supabase.createClient(UM_CONFIG.SUPABASE_URL,UM_CONFIG.SUPABASE_ANON_KEY);
const motionAllowed=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stepEl=document.getElementById('step');
let link=null,code=null,stepIdx=0,flow=[],draft={ratings:{},remarks:{},open:{}},previousProgress=0;

function codeFromUrl(){const m=location.pathname.match(/\/f\/([A-Za-z0-9]+)/);return (m&&m[1])||new URLSearchParams(location.search).get('code')}
function scrollTop(){window.scrollTo({top:0,behavior:motionAllowed?'smooth':'instant'})}
function saveDraft(){try{sessionStorage.setItem('um-draft-'+code,JSON.stringify({stepIdx,draft}))}catch(e){}}
function showState(title,body){document.getElementById('progress').innerHTML='';stepEl.innerHTML=`<div class="state"><h2>${title}</h2><p>${body}</p></div>`}

async function boot(){
  code=codeFromUrl();
  if(!code)return showState('This link is incomplete','Please open the link exactly as it appears in the email from U&amp;M Designs.');
  const {data,error}=await sb.rpc('get_link',{p_code:code});
  if(error||!data||!data.length)return showState("We couldn't find this link",'It may have been copied incompletely. Please use the link from the email, or reply to it and we will send a fresh one.');
  link=data[0];
  if(link.answered)return showState('Thank you — already received','This link has already been used to send feedback. If you would like to add anything, simply reply to the email from our Managing Director.');
  flow=[...link.depts.filter(d=>DEPTS.includes(d)),'E'];
  try{const saved=JSON.parse(sessionStorage.getItem('um-draft-'+code)||'null');if(saved&&saved.draft){draft=saved.draft;stepIdx=Math.max(0,Math.min(saved.stepIdx||0,flow.length+1))}}catch(e){}
  previousProgress=stepIdx>0?Math.round((stepIdx-1)/(flow.length+1)*100):0;
  renderStep();
}

function renderStep(){
  document.getElementById('progress').innerHTML='';
  if(stepIdx===0)return renderIntro();
  if(stepIdx===flow.length+2)return renderThanks();
  const isOpen=stepIdx===flow.length+1;
  const sec=isOpen?null:SEC[flow[stepIdx-1]];
  const total=flow.length+1;
  const title=isOpen?'Your thoughts, in your words':sec.id==='E'?'The bigger picture':sec.name;
  const info=isOpen?'This is your opportunity to tell us what matters most. Every written answer is completely optional and goes directly to our Managing Director.'
    :sec.id==='E'?'A few final reflections on our overall partnership.':`Think about your recent experience with our ${sec.who}. There are no right or wrong answers.`;
  const percent=Math.round(stepIdx/total*100);
  stepEl.innerHTML=`<div class="survey-stage">
    <aside class="survey-aside">
      <div class="part-counter">SECTION ${String(stepIdx).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div>
      <h2>${title}</h2>
      <p>${info}</p><div class="section-line"></div>
      <p class="aside-note">Your perspective helps us make every collaboration better.</p>
    </aside>
    <div class="survey-main">
      <div class="survey-head"><div class="survey-head-top"><span>YOUR FEEDBACK JOURNEY</span><span><b>Step ${stepIdx}</b> of ${total}</span></div>
      <div class="step-track" role="progressbar" aria-label="Survey progress" aria-valuenow="${stepIdx}" aria-valuemax="${total}" aria-valuemin="0"><span id="survey-fill" style="width:${previousProgress}%"></span></div></div>
      ${isOpen?'<p class="qa-tip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v1"/></svg>Optional — share as much or as little as you like. All responses are reviewed together with your ratings.</p>':`<p class="qa-tip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v1"/></svg>Select what best describes your experience. Choose “Doesn’t apply” if you haven’t dealt with it.</p><div class="answer-progress"><div class="answer-progress-label"><span id="answer-count" aria-live="polite">0 questions answered</span><span id="all-answered" hidden>All set ✓</span></div><div class="answer-track" aria-hidden="true"><span id="answers-fill"></span></div></div>`}
      ${isOpen?`
        <div class="open"><div class="open-tag">YOUR TOP PRIORITY</div><label for="f1">${OPEN[0][1]}</label><textarea id="f1" data-open="f1" placeholder="What would make working with us better?">${esc(draft.open.f1||'')}</textarea></div>
        <details class="optional-details"><summary>Share more feedback <small>(3 optional questions)</small></summary>
          ${OPEN.slice(1).map(([k,t])=>`<div class="open"><label for="${k}">${t}</label><textarea id="${k}" data-open="${k}" placeholder="Your thoughts, if you'd like to share…">${esc(draft.open[k]||'')}</textarea></div>`).join('')}
        </details>`
      :sec.qs.map(([n,text],idx)=>`
        <div style="--q-index:${idx}" class="q ${draft.ratings[n]!==undefined?'done':''} ${draft.ratings[n]==='NA'?'na-picked':''}" data-q="${n}">
          <div class="q-head"><span class="q-no">${draft.ratings[n]!==undefined&&draft.ratings[n]!=='NA'?'✓':String(idx+1).padStart(2,'0')}</span><span class="q-text" id="question-${n}">${text}</span></div>
          <div class="scale" role="group" aria-labelledby="question-${n}">
            ${[1,2,3,4,5].map(v=>`<button type="button" class="face ${draft.ratings[n]===v?'pick':''}" data-rate="${v}" aria-label="${SCALE_LABELS[v]}" aria-pressed="${draft.ratings[n]===v}" title="${SCALE_LABELS[v]}">${faceSvg(v)}<span class="fl">${SCALE_LABELS[v]}</span></button>`).join('')}
          </div><div class="na-row"><button type="button" class="${draft.ratings[n]==='NA'?'pick':''}" data-rate="NA" aria-pressed="${draft.ratings[n]==='NA'}">Doesn't apply to me</button></div>
          <details class="remark" ${draft.remarks[n]?'open':''}><summary>Add context to your rating <span style="color:#898a89;font-weight:400">(optional)</span></summary><textarea data-remark="${n}" placeholder="Anything you'd like us to know?">${esc(draft.remarks[n]||'')}</textarea></details>
        </div>`).join('')}
      <div class="unanswered" id="unans" role="alert">Please answer the highlighted questions, or choose “Doesn't apply”.</div>
      <div class="nav"><button class="btn ghost" id="back" type="button">← Previous</button><button type="button" class="btn ${isOpen?'brass':'primary'}" id="next">${isOpen?'Submit feedback':'Continue'} <span class="arr">→</span></button></div>
    </div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const el=document.getElementById('survey-fill');if(el)el.style.width=percent+'%'}));
  previousProgress=percent;
  function updateCount(){
    if(isOpen)return;
    const done=sec.qs.filter(([n])=>draft.ratings[n]!==undefined).length;
    document.getElementById('answer-count').textContent=done+' of '+sec.qs.length+' questions answered';
    document.getElementById('answers-fill').style.width=(done/sec.qs.length*100)+'%';
    document.getElementById('all-answered').hidden=done!==sec.qs.length;
  }
  updateCount();
  stepEl.querySelectorAll('[data-rate]').forEach(b=>b.addEventListener('click',()=>{
    const q=b.closest('.q');const n=+q.dataset.q;const v=b.dataset.rate;const fresh=draft.ratings[n]===undefined;
    draft.ratings[n]=v==='NA'?'NA':+v;
    q.querySelectorAll('[data-rate]').forEach(x=>{const yes=x===b;x.classList.toggle('pick',yes);x.setAttribute('aria-pressed',String(yes))});
    q.classList.remove('missing');q.classList.add('done');q.classList.toggle('na-picked',v==='NA');
    const number=q.querySelector('.q-no');if(number)number.textContent=v==='NA'?String([...stepEl.querySelectorAll('.q')].indexOf(q)+1).padStart(2,'0'):'✓';
    b.classList.remove('rating-burst');void b.offsetWidth;b.classList.add('rating-burst');
    q.classList.remove('card-confirm');void q.offsetWidth;q.classList.add('card-confirm');
    document.getElementById('unans').style.display='none';updateCount();saveDraft();
    if(fresh&&motionAllowed){const nxt=[...stepEl.querySelectorAll('.q')].find(x=>draft.ratings[+x.dataset.q]===undefined);
      setTimeout(()=>{(nxt||document.getElementById('next')).scrollIntoView({behavior:'smooth',block:nxt?'center':'end'})},320)}
  }));
  stepEl.querySelectorAll('[data-remark]').forEach(t=>t.addEventListener('input',()=>{draft.remarks[+t.dataset.remark]=t.value;saveDraft()}));
  stepEl.querySelectorAll('[data-open]').forEach(t=>t.addEventListener('input',()=>{draft.open[t.dataset.open]=t.value;saveDraft()}));
  document.getElementById('back').onclick=()=>{stepIdx=Math.max(0,stepIdx-1);saveDraft();renderStep();scrollTop()};
  document.getElementById('next').onclick=()=>{
    if(!isOpen){const missing=sec.qs.filter(([n])=>draft.ratings[n]===undefined);
      if(missing.length){document.getElementById('unans').style.display='block';missing.forEach(([n])=>stepEl.querySelector(`[data-q="${n}"]`).classList.add('missing'));stepEl.querySelector('.q.missing').scrollIntoView({behavior:'smooth',block:'center'});return}}
    if(isOpen)submit();else{stepIdx++;saveDraft();renderStep();scrollTop()}
  };
}

function renderIntro(){
  const n=flow.reduce((a,d)=>a+SEC[d].qs.length,0);
  const minutes=Math.max(3,Math.ceil((n+4)/4));
  const firstname=link.contact.trim().split(/\s+/)[0]||'there';
  stepEl.innerHTML=`<div class="welcome">
    <div class="welcome-content">
      <div class="eyebrow">AN INVITATION FROM U&M DESIGNS</div>
      <h1>Your experience.<br><em>Our inspiration.</em></h1>
      <p class="lead">Hello ${esc(firstname)}, we'd love to hear how it's been working together. Your honest feedback helps us improve the quality, service and partnership you expect from U&M Designs.</p>
      <div class="welcome-actions"><button class="btn primary" id="next" type="button">Share your feedback <span class="arr" aria-hidden="true">→</span></button><span class="welcome-about">About <strong>${minutes} minutes</strong><br>${n} quick ratings + optional comments</span></div>
      <div class="welcome-meta">
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M7 12l3.3 3.3L17 8"/></svg>No sign-in required</span>
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>Confidential — read by the Managing Director</span>
      </div>
    </div>
    <div class="welcome-visual"><div class="welcome-mark">UPHOLSTERY & MORE</div>
      <svg class="craft-lines" viewBox="0 0 320 330" fill="none" aria-hidden="true"><path d="M103 198 V124 C103 72 137 52 201 57 C260 61 271 88 271 130 V204 M106 198 Q115 161 136 150 Q179 139 242 153 Q262 167 272 198 M93 199 Q102 181 117 179 M277 198 Q281 179 293 181 M103 201 C143 211 236 211 271 201 L266 236 C223 249 149 248 107 236 Z M124 243 L118 286 M253 243 L257 285 M117 286 L133 286 M242 285 L264 285 M109 123 C110 85 142 72 197 75"/></svg>
      <p class="visual-quote">Better partnerships begin with <strong>listening.</strong></p>
      <div class="visual-lower"><span>Prepared for<br><b>${esc(link.company)}</b><br>${esc(link.contact)}</span><span>${flow.map(d=>esc(SEC[d].name)).join('<br>')}</span></div>
    </div>
  </div>`;
  document.getElementById('next').onclick=()=>{stepIdx=1;saveDraft();renderStep();scrollTop()};
}
function renderThanks(){
  const firstname=link.contact.trim().split(/\s+/)[0]||'there';
  stepEl.innerHTML=`<div class="thanks" role="status">
    <div class="seal"><svg viewBox="0 0 52 52" aria-hidden="true"><path d="M12 27L22 37L41 15"/></svg></div>
    <div class="eyebrow" style="justify-content:center;margin:0 auto 16px">YOUR VOICE MATTERS</div>
    <h2>Thank you for sharing, ${esc(firstname)}.</h2>
    <p>Your feedback has gone directly to the Managing Director of U&M Designs and will be treated as confidential. You can close this page.</p>
  </div>`;
}
async function submit(){
  const btn=document.getElementById('next');btn.classList.add('busy');btn.textContent='Sending…';
  const open={};OPEN.forEach(([k])=>{if((draft.open[k]||'').trim())open[k]=draft.open[k].trim()});
  const remarks={};Object.entries(draft.remarks).forEach(([k,v])=>{if((v||'').trim())remarks[k]=v.trim()});
  const {error}=await sb.rpc('submit_response',{p_code:code,p_ratings:draft.ratings,p_remarks:remarks,p_open:open});
  if(error){btn.classList.remove('busy');btn.innerHTML='Submit feedback <span class="arr">→</span>';
    toast(/already/.test(error.message)?'This link has already been used.':'Could not send — please check your connection and try again.');return}
  try{sessionStorage.removeItem('um-draft-'+code)}catch(e){}
  stepIdx=flow.length+2;renderStep();scrollTop();
}
boot();
</script>
</body>
</html>
